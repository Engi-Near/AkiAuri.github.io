<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dollistan Notes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" title="default" id="default-style">
    <link rel="stylesheet" href="alt-style.css" title="alternate" id="alternate-style" disabled>
</head>
<body>
<button id="sidebar-toggle" aria-label="Open Sidebar">☰</button>
<button id="style-toggle">Switch Style</button>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-content">
        <div>
            <div class="sidebar-group">Defuntotrons</div>
            <div class="sidebar-group">PVP<br>Enabled</div>
        </div>
        <div id="kyue-btn-container"></div>
        <div id="sparrow-btn-container"></div>
        <button id="logout-btn" class="sidebar-btn">Change<br>Name</button>
    </div>
</aside>
<main class="main-content">
    <h1 class="title">Dollistan Notes:</h1>
    <div class="pda-container">
        <div id="chatbox" class="chatbox"></div>
        <form id="chat-form" class="chat-input-bar" autocomplete="off">
            <input id="message" type="text" placeholder="Text Message Here" autocomplete="off" />
            <button id="sendBtn" type="submit" aria-label="Send">⮞</button>
        </form>
    </div>
</main>
<!-- Add the backdrop element here: -->
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="firebase-client.js"></script>
<script src="design.js"></script>
<script src="chat.js"></script>
<script>
document.getElementById('style-toggle').addEventListener('click', () => {
    const defaultStyle = document.getElementById('default-style');
    const altStyle = document.getElementById('alternate-style');

    if (altStyle.disabled) {
        altStyle.disabled = false;
        defaultStyle.disabled = true;
    } else {
        altStyle.disabled = true;
        defaultStyle.disabled = false;
    }
});
</script>
<script>
document.getElementById("sidebar-toggle").addEventListener("click", () => {
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("sidebar-backdrop");

    sidebar.classList.toggle("sidebar-open");
    backdrop.classList.toggle("active");
});

document.getElementById("sidebar-backdrop").addEventListener("click", () => {
    document.getElementById("sidebar").classList.remove("sidebar-open");
    document.getElementById("sidebar-backdrop").classList.remove("active");
});
</script>
</body>
</html>
